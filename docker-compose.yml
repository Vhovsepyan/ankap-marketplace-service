services:
  # --- SPRING BOOT MICROSERVICES ---
  analytics-service:
    build: ./analytics-service
    container_name: ankap-analytics-service
    ports:
      - "8084:8084"
      - "5025:5025"
    environment:
      - SERVER_PORT=8084
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5025
    depends_on:
      - kafka
      - zipkin
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: ankap-auth-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres
      - zipkin
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: ankap-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - ANALYTICS_SERVICE_URL=http://analytics-service:8084
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - zipkin
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: ankap-order-service
    ports:
      - "8083:8083"
      - "5015:5015"
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - LEDGERFLOW_URL=http://ledgerflow:8080
      - LEDGERFLOW_MERCHANT_ID=11111111-1111-1111-1111-111111111111
      - LEDGERFLOW_CURRENCY=USD
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5015
    depends_on:
      - postgres
      - kafka
      - zipkin
      - product-service
      - ledgerflow
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: ankap-product-service
    ports:
      - "8082:8082"
      - "5005:5005"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      - postgres
      - redis
      - kafka
      - zipkin
    restart: unless-stopped

  # --- PAYMENTS (LedgerFlow, a separate repo checked out next to this one) ---
  # Orders are charged through LedgerFlow, which owns the money: it authorizes and
  # captures against a provider and records every movement as double-entry bookkeeping.
  # It shares this stack's Kafka so order-service can consume `payment-events` directly,
  # but keeps its own Postgres 17 — its schema is its own and the marketplace never reads it.
  ledgerflow:
    build: ../ledgerflow
    container_name: ankap-ledgerflow
    ports:
      - "8085:8080"
    environment:
      - DB_HOST=ledgerflow-postgres
      - DB_PORT=5432
      - DB_NAME=ledgerflow
      - DB_USER=ledgerflow
      - DB_PASSWORD=ledgerflow
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PSP_BASE_URL=http://mock-psp:9090
    depends_on:
      ledgerflow-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      mock-psp:
        condition: service_started
    restart: unless-stopped

  ledgerflow-postgres:
    image: postgres:17-alpine
    container_name: ankap-ledgerflow-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
    volumes:
      - ledgerflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledgerflow" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The fake payment provider LedgerFlow talks to. It declines, errors and times out
  # on purpose; see LEDGERFLOW.md for how to turn the chaos off.
  mock-psp:
    build: ../ledgerflow/mock-psp
    container_name: ankap-mock-psp
    ports:
      - "9091:9090"
    restart: unless-stopped

  # LedgerFlow's payment.merchant_id is a foreign key, so the marketplace needs a
  # merchant row before it can create anything. Flyway creates the table at
  # LedgerFlow startup, so this waits for the table rather than for the container.
  ledgerflow-merchant-seed:
    image: postgres:17-alpine
    container_name: ankap-ledgerflow-seed
    depends_on:
      - ledgerflow
    environment:
      PGPASSWORD: ledgerflow
    entrypoint:
      - sh
      - -c
      - |
        until psql -h ledgerflow-postgres -U ledgerflow -d ledgerflow -c 'select 1 from merchant limit 1' >/dev/null 2>&1; do
          echo 'waiting for the LedgerFlow schema...'
          sleep 2
        done
        psql -h ledgerflow-postgres -U ledgerflow -d ledgerflow \
          -c "insert into merchant (id, name) values ('11111111-1111-1111-1111-111111111111', 'Ankap Marketplace') on conflict (id) do nothing;"
        echo 'merchant seeded'
    restart: on-failure

  # --- INFRASTRUCTURE ---
  # 1. PostgreSQL - Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: ankap-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # 2. Redis - Caching & Real-Time Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: ankap-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Kafka (Using Confluent Image - Rancher/Windows friendly)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ankap-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      # Tell Kafka to use its Docker container name instead of localhost!
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ankap-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ankap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ankap-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  ledgerflow_postgres_data: