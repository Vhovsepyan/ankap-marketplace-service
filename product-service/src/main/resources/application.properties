server.port=8082
spring.application.name=product-service

# Pointing ONLY to the product_db
spring.datasource.url=jdbc:postgresql://localhost:5432/product_db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate create tables for us just for this rapid prototyping phase
spring.jpa.hibernate.ddl-auto=update

# MUST match the secret from Auth Service!
security.jwt.secret=AnkapMarketplaceSuperSecretKey32

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ankap.platform.productservice.dto.OrderPlacedEvent
# Enable tracing for Kafka senders and listeners
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans