spring.application.name=orderEntity-service
server.port=8083

# Pointing ONLY to the order_db
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# MUST match the secret from Auth Service and Product Service!
security.jwt.secret=AnkapMarketplaceSuperSecretKey32

# The URL of the product service so Feign knows where to call
product-service.url=http://localhost:8082

# LedgerFlow: the payment orchestration service that actually moves the money.
# The merchant row must exist in LedgerFlow's database (payment.merchant_id is a FK).
ledgerflow.url=http://localhost:8085
ledgerflow.merchant-id=11111111-1111-1111-1111-111111111111
ledgerflow.currency=USD
ledgerflow.payment-events-topic=payment-events

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Enable tracing for Kafka senders and listeners
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
spring.cloud.openfeign.micrometer.enabled=true

spring.cloud.openfeign.circuitbreaker.enabled=true
server.error.include-message=always

# Feign's circuit breaker wraps every call in a Resilience4j TimeLimiter, whose
# default is 1 second. A payment is not a fast call: LedgerFlow retries the
# provider up to three times with backoff before it answers, so the default
# cancels calls that were going to succeed and leaves payments stranded mid-flight.
resilience4j.timelimiter.configs.default.timeout-duration=20s
resilience4j.timelimiter.configs.default.cancel-running-future=false