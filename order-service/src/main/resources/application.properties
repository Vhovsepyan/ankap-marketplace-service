spring.application.name=order-service
server.port=8083

# Pointing ONLY to the order_db
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# MUST match the secret from Auth Service and Product Service!
security.jwt.secret=AnkapMarketplaceSuperSecretKey32

# The URL of the product service so Feign knows where to call
product-service.url=http://localhost:8082

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Enable tracing for Kafka senders and listeners
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
spring.cloud.openfeign.micrometer.enabled=true

spring.cloud.openfeign.circuitbreaker.enabled=true
server.error.include-message=always