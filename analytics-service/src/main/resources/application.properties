server.port=8084
spring.application.name=analytics-service

security.jwt.secret=AnkapMarketplaceSuperSecretKey32

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# Enable tracing for Kafka senders and listeners
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# We will create this DTO in the next step!
spring.kafka.consumer.properties.spring.json.value.default.type=com.ankap.platform.analyticsservice.dto.OrderPlacedEvent